<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
        crossorigin="anonymous"
        />
    <link rel="stylesheet" href="style.css" />

    <title>Resume Builder</title>
</head>
<body>

    <div class="container">
        <h1 class="text-center my-2">Resume Generator</h1>
        <p class="text-center">Simplest Way to create Resume</p>

        <div class="row">

            <div class="col-md-6">
                <!-- first col-->
                <h3>Personal Information</h3>

                <div class="form-group">
                    <label for="nameField">Enter Full Name</label>
                    <input 
                        type="text" 
                        id="nameField" 
                        placeholder="eg. Rishi Soni " 
                        class="form-control"
                        />
                </div>

                <div class="form-group mt-2">
                    <label for="contactField">Enter Contact Number</label>
                    <input 
                        type="text" 
                        id="contactField" 
                        placeholder="eg. +91-0123456789 " 
                        class="form-control"
                        />
                </div>
                

                <div class="form-group my-2">
                    <label for="addressField">Enter Address</label>
                    <textarea 
                        id="addressField" 
                        placeholder="eg. 214,sector-3 delhi 110001" 
                        class="form-control"
                        rows="4"
                        ></textarea>
                </div>

                <p class="text-secondary mt-2">Important Links</p>
                <div class="form-group mt-2">
                    <label for="fbField">Facebook Link</label>
                    <input 
                        type="text" 
                        id="fbField" 
                        placeholder="eg. +91-0123456789 " 
                        class="form-control"
                        />
                </div>
                <div class="form-group mt-2">
                    <label for="instaField">Instagram Link</label>
                    <input 
                        type="text" 
                        id="instaField" 
                        placeholder="eg. +91-0123456789 " 
                        class="form-control"
                        />
                </div>
                <div class="form-group mt-2">
                    <label for="linkedField">LinkedIn Link</label>
                    <input 
                        type="text" 
                        id="linkedField" 
                        placeholder="eg. +91-0123456789 " 
                        class="form-control"
                        />
                </div>
            </div>
            <div class="col-md-6">
                <!-- second col-->
                <h3>Professional Information</h3>

                <div class="form-group my-2">
                    <label for="">Objective</label>
                    <textarea 
                        placeholder="eg. Seeking an IT role to apply my skills and innovation." 
                        class="form-control "
                        rows = "5"
                        ></textarea>
                </div>  

                <div class="form-group my-2" id="we">
                    <label for="">Work Experience</label>
                    <textarea 
                        placeholder="eg. Seeking an IT role to apply my skills and innovation." 
                        class="form-control weField"
                        rows = "3"
                        ></textarea>



                        <div class="container text-center mt-2" id="weAddButton">
                            <button onclick="addNewWEField()" class="btn btn-primary btn-sm">Add</button>
                        </div>
                </div>  


                <div class="form-group my-2">
                    <label for="">Academic Qualification</label>
                    <textarea 
                        placeholder="Enter here" 
                        class="form-control eqField"
                        rows = "3"
                        ></textarea>

                        <div class="container text-center mt-2" id ="aqAddButton">
                            <button class="btn btn-primary btn-sm">Add</button>
                        </div>
                </div> 
            </div>
        </div>

        <div class="container text-center mt-3">
            <button class="btn btn-primary btn-lg">Generate Resume</button>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" 
    crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
